
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Alberto Clocks</title>

<link rel="icon" type="image/x-icon" href="material/logo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-card">
 

    <section class="form-panel">

        <div class="logo-text">
            Alberto <span>Clocks.</span>
        </div>

        <h2>Welcome Back.</h2>

        <p class="description">
            Sign in to continue your checkout and make your next
            timeless purchase.
        </p>

        <form id="loginForm">

            <label for="email" class="form-label">Email Address</label>
            <div class="input-box">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="email" class="form-control"
                       placeholder="Enter your email" required
                       autocomplete="email">
            </div>

            <label for="password" class="form-label">Password</label>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" class="form-control"
                       placeholder="Enter your password" required
                       autocomplete="current-password">

                <button type="button" class="password-toggle"
                        id="togglePassword" aria-label="Show password">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="login-btn">
                Login & Continue
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <a href="collections.html" class="back-link">
            <i class="fa-solid fa-arrow-left me-1"></i>
            Back to Collections
        </a>

        <div class="secure-note">
            <i class="fa-solid fa-shield-halved"></i>
            YOUR LUXURY EXPERIENCE AWAITS
        </div>

    </section>
</div>

<script>
const password = document.getElementById("password");
const toggle = document.getElementById("togglePassword");

toggle.addEventListener("click", function () {
    const show = password.type === "password";

    password.type = show ? "text" : "password";
    toggle.innerHTML = show
        ? '<i class="fa-regular fa-eye-slash"></i>'
        : '<i class="fa-regular fa-eye"></i>';
});

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Demo only: credentials are not verified.
    sessionStorage.setItem("albertoLoggedIn", "true");
    window.location.href = "collections.html";
});
</script>

</body>
</html>
